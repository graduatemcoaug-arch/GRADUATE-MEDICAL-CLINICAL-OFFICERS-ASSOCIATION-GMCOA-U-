<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote | GMCOA-U</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-brand">
      <img src="logo.png" alt="GMCOA-U logo" class="mark">
      GMCOA-U
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="elections.html">Elections</a>
      <a href="dashboard.html">My Dashboard</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="section-eyebrow" id="election-title">Loading…</div>
    <h1>Cast Your Vote</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="ballot-form-wrap">
      <p style="color:var(--text-muted);margin-bottom:20px;">Select one candidate. Your vote is secret — it is never linked to your identity.</p>
      <div id="ballot-options"></div>
      <button class="btn btn-primary" id="submit-vote-btn" disabled style="margin-top:16px;">Submit Vote</button>
    </div>
    <p id="ballot-status" style="margin-top:20px;font-size:0.95rem;font-weight:600;"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="vote.js"></script>
</body>
</html>
