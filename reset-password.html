<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | GMCOA-U</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-brand">
      <img src="logo.png" alt="GMCOA-U logo" class="mark">
      GMCOA-U
    </a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="section-eyebrow">Member Portal</div>
    <h1>Set a New Password</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="admin-login-box">
      <form id="new-password-form">
        <label for="new-password">New Password</label>
        <input id="new-password" type="password" minlength="6" required>
        <button class="btn btn-primary" type="submit">Update Password</button>
      </form>
      <p id="reset-note" style="margin-top:14px;font-size:0.88rem;"></p>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
