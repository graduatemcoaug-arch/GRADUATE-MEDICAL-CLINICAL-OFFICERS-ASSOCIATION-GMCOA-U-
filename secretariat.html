<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secretariat Tools | GMCOA-U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="nav-brand">
      <img src="logo.png" alt="GMCOA-U logo" class="mark">
      GMCOA-U
    </a>
    <nav class="nav-links" id="nav-links">
      <a href="admin.html">Applications</a>
      <a href="finance.html">Finance</a>
      <a href="governance.html">Governance</a>
      <a href="comms.html">Communications</a>
      <a href="agm-admin.html">AGM/EGM</a>
      <a href="events-admin.html">Events</a>
      <a href="index.html">Public Site</a>
    </nav>
    <div class="nav-actions">
      <button class="btn btn-outline" id="logout-btn" style="display:none;color:#fff;">Log Out</button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="section-eyebrow">Secretariat</div>
    <h1>Secretariat Tools</h1>
  </div>
</section>

<section class="section">
  <div class="container">

    <div id="admin-login">
      <div class="admin-login-box">
        <h3 style="margin:0;">Admin Login</h3>
        <form id="admin-login-form">
          <label for="admin-email">Email</label>
          <input id="admin-email" type="email" required>
          <label for="admin-password">Password</label>
          <input id="admin-password" type="password" required>
          <button class="btn btn-primary" type="submit">Log In</button>
        </form>
        <p id="login-note" style="margin-top:12px;font-size:0.88rem;"></p>
      </div>
    </div>

    <div id="admin-dashboard" style="display:none;">

      <div class="media-tabs" id="sec-tabs">
        <button class="active" data-tab="docs">Documents</button>
        <button data-tab="tasks">Tasks</button>
        <button data-tab="committees">Committees</button>
        <button data-tab="strategy">Strategic Plan</button>
      </div>

      <!-- DOCUMENTS -->
      <div class="comms-panel active" id="tab-docs">
        <div class="finance-form-box" style="margin-bottom:22px;">
          <h3>Upload a Document</h3>
          <form id="document-form">
            <label>Title</label>
            <input type="text" name="title" required>
            <label>Category</label>
            <select name="category">
              <option>Constitution</option><option>Policy</option><option>Circular</option><option>Letter</option>
              <option>Report</option><option>Contract</option><option>Minutes</option><option>Strategic Plan</option><option>Other</option>
            </select>
            <label>Version</label>
            <input type="text" name="version_number" value="1.0">
            <label>File Link</label>
            <input type="url" name="file_link" required placeholder="Link to the file (e.g. Google Drive)">
            <label>Approval Status</label>
            <select name="approval_status"><option>Draft</option><option>Under Review</option><option>Approved</option></select>
            <button class="btn btn-primary" type="submit">Save Document</button>
          </form>
        </div>
        <div id="documents-list"><p class="card-empty">Loading…</p></div>
      </div>

      <!-- TASKS -->
      <div class="comms-panel" id="tab-tasks">
        <div class="finance-form-box" style="margin-bottom:22px;">
          <h3>New Task</h3>
          <form id="task-form">
            <label>Title</label>
            <input type="text" name="title" required>
            <label>Description</label>
            <input type="text" name="description">
            <label>Assigned To</label>
            <input type="text" name="assigned_to">
            <label>Due Date</label>
            <input type="date" name="due_date">
            <label>Priority</label>
            <select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
            <label>Related Area</label>
            <input type="text" name="related_area" placeholder="e.g. AGM 2026">
            <button class="btn btn-primary" type="submit">Add Task</button>
          </form>
        </div>
        <div id="tasks-list"><p class="card-empty">Loading…</p></div>
      </div>

      <!-- COMMITTEES -->
      <div class="comms-panel" id="tab-committees">
        <div class="finance-form-box" style="margin-bottom:22px;">
          <h3>Log a Committee Meeting</h3>
          <form id="committee-meeting-form">
            <label>Committee</label>
            <select name="committee_id" id="committee-meeting-select" required></select>
            <label>Meeting Date</label>
            <input type="date" name="meeting_date">
            <label>Agenda</label>
            <input type="text" name="agenda">
            <label>Minutes Link</label>
            <input type="url" name="minutes_link">
            <label>Virtual Meeting Platform</label>
            <select name="virtual_meeting_platform"><option>Zoom</option><option>Google Meet</option><option>Microsoft Teams</option><option>Other</option></select>
            <label>Virtual Meeting Link</label>
            <input type="url" name="virtual_meeting_link">
            <button class="btn btn-primary" type="submit">Log Meeting</button>
          </form>
        </div>
        <div id="committees-list"><p class="card-empty">Loading…</p></div>
      </div>

      <!-- STRATEGIC PLAN -->
      <div class="comms-panel" id="tab-strategy">
        <div class="finance-form-box" style="margin-bottom:22px;">
          <h3>Add a Strategic Goal</h3>
          <form id="goal-form">
            <label>Goal</label>
            <input type="text" name="goal" required>
            <label>Category</label>
            <input type="text" name="category" placeholder="e.g. Membership Growth">
            <label>Target Date</label>
            <input type="date" name="target_date">
            <label>Progress (%)</label>
            <input type="number" name="progress_percent" min="0" max="100" value="0">
            <label>Notes</label>
            <input type="text" name="notes">
            <button class="btn btn-primary" type="submit">Save Goal</button>
          </form>
        </div>
        <div id="goals-list"><p class="card-empty">Loading…</p></div>
      </div>

    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="secretariat.js"></script>
</body>
</html>
